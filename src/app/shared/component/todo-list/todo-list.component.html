
<div class="card">
    <div class="card-body">
        <ul class="list-group" *ngIf="todosArr.length>0 ; else noTodo">
            <li class="list-group-item d-flex justify-content-between" *ngFor="let t of todosArr">
                <strong>{{t.todoName}}</strong>

                <span class="badge"
                [ngClass]="{
                    'badge-primary':t.status,
                    'badge-warning':!t.status
                }"
                >
                    {{t.status?'Completed':'Pending'}}
                </span>

                <div>
                    <button
                    (click)="onEdit(t)"
                    mat-raised-button color="primary" class="mr-3">Edit</button>
                    <button
                    (click)="onRemove(t.todoId)"
                    mat-raised-button color="warn">Remove</button>

                </div>
            </li>
        </ul>

        <ng-template #noTodo>
            <p class="alert alert-info">No Todos!!</p>
        </ng-template>
    </div>
</div>

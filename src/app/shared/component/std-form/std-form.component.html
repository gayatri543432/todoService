<div class="row mb-5">
    <div class="col-md-6 offset-md-3">
        <div class="card">
    <div class="card-body">
        <form #stdForm="ngForm"  (ngSubmit)="onSubmit()">
            <h2 class="text-center">{{isInEditMode?'Update Student':'Add Student'}}</h2>
            <div class="form-group">
                <label for="studentName">Name*</label>
                <input type="text" ngModel name="studentName" class="form-control">
            </div>
             <div class="form-group">
                <label for="age">Age*</label>
                <input type="number" ngModel name="age" class="form-control">
            </div>
            <div class="form-group">
                <label for="city">City*</label>
                <input type="text" ngModel name="city" class="form-control">
            </div>
             <div class="form-group">
                <label for="course">Course*</label>
                <input type="text" ngModel name="course" class="form-control">
            </div>
            <div class="form-group">
                <label for="marks">Marks*</label>
                <input type="number" ngModel name="marks" class="form-control">
            </div>
            <div class="form-group">
                <label for="isActive">Is Active*</label>
                <select name="isActive" id="isActive" ngModel class="form-control">
                    <option [ngValue]="true">Yes</option>  
                    <option [ngValue]="false">No</option>    
                </select>
            </div>

            <div class="form-group">
                <button
                class="btn-block"
                *ngIf="!isInEditMode" mat-raised-button color="primary">Add Todo</button>
                <button
                class="btn-block"
                type="button"
                (click)="onUpdate()"
                *ngIf="isInEditMode" mat-raised-button color="accent">Update Todo</button>

            </div>
        </form>
    </div>
</div>
    </div>
</div>

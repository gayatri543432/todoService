
<div class="card">
    <div class="card-body">
        <h2 class="text-center">{{isInEditMode?'Update Todo':'Add Todo'}}</h2>
        <form #todoForm="ngForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="todoName"> Todo Name*</label>
                <input type="text" class="form-control" ngModel required name="todoName">
            </div>

            <div class="form-group">
                <label for="status"> Status*</label>
                <select class="form-control" ngModel required name="status">
                    <option [ngValue]="true">Completed</option>
                    <option [ngValue]="false">Pending</option>
                </select>
            </div>

            <button
            class="btn-block"
            *ngIf="!isInEditMode"
            mat-raised-button color="primary">Add Todo</button>
            <button
            type="button"
            (click)="onUpdate()"
            *ngIf="isInEditMode"
            class="btn-block"
            mat-raised-button color="accent">Update Todo</button>

        </form>
    </div>
</div>
